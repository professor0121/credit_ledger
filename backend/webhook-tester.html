<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Webhook Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #10b981;
      --primary-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: #475569;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group.row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .form-group.row {
        grid-template-columns: 1fr 1fr;
      }
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input, select, textarea {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    textarea {
      resize: vertical;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.875rem;
    }

    .btn {
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      width: 100%;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--accent);
    }
    
    .btn-secondary:hover {
      background-color: #2563eb;
    }

    .tab-container {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }

    .tab {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .console {
      background-color: #090d16;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.875rem;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 1.5rem;
      color: #38bdf8;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .status-info {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .log-line {
      margin-bottom: 0.5rem;
      white-space: pre-wrap;
    }

    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-info { color: #60a5fa; }
    .log-input { color: #e2e8f0; }

    .payload-select {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WhatsApp Webhook Tester</h1>
      <p>Simulate Meta Graph API Verification and Event Delivery locally or on production</p>
    </header>

    <div class="grid">
      <!-- Configuration Card -->
      <div class="card">
        <div class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Webhook Configuration
        </div>
        <div class="form-group row">
          <div>
            <label for="webhookUrl">Webhook Target URL</label>
            <input type="url" id="webhookUrl" value="" placeholder="https://your-domain.vercel.app/">
          </div>
          <div>
            <label for="verifyToken">Verification Token (WA_VERIFY_TOKEN)</label>
            <input type="text" id="verifyToken" value="credit_ledger_verify_token_secure_2026" placeholder="Enter your verification secret">
          </div>
        </div>
      </div>

      <!-- Test Control Card -->
      <div class="card" style="margin-top: 1.5rem;">
        <div class="tab-container">
          <div class="tab active" onclick="switchTab('get-tab')">GET Verification</div>
          <div class="tab" onclick="switchTab('post-tab')">POST Event Simulator</div>
        </div>

        <!-- GET Tab -->
        <div id="get-tab" class="tab-content active">
          <div class="form-group row">
            <div>
              <label for="hubMode">hub.mode</label>
              <input type="text" id="hubMode" value="subscribe">
            </div>
            <div>
              <label for="hubChallenge">hub.challenge</label>
              <input type="text" id="hubChallenge" value="challenge_secret_9948">
            </div>
          </div>
          <button class="btn btn-secondary" onclick="runVerificationTest()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Send Verification Request (GET)
          </button>
        </div>

        <!-- POST Tab -->
        <div id="post-tab" class="tab-content">
          <div class="form-group payload-select">
            <label for="payloadType">Sample Payload Preset</label>
            <select id="payloadType" onchange="loadPresetPayload()">
              <option value="text">Incoming Customer Message (Text)</option>
              <option value="delivered">Message Status: Delivered</option>
              <option value="read">Message Status: Read</option>
            </select>
          </div>
          <div class="form-group">
            <label for="postPayload">JSON Body</label>
            <textarea id="postPayload" rows="12"></textarea>
          </div>
          <button class="btn" onclick="runEventTest()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            Send Simulated Event (POST)
          </button>
        </div>

        <!-- Console logs -->
        <div class="console">
          <div class="console-header">
            <span>Console Output</span>
            <span id="responseStatus" class="status-badge status-info">Ready</span>
          </div>
          <div id="consoleLogs">
            <div class="log-line log-info">System initialized. Click one of the buttons above to test your webhook.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PRESETS = {
      text: {
        "object": "whatsapp_business_account",
        "entry": [
          {
            "id": "123456789012345",
            "changes": [
              {
                "value": {
                  "messaging_product": "whatsapp",
                  "metadata": {
                    "display_phone_number": "15555555555",
                    "phone_number_id": "1209225485597206"
                  },
                  "contacts": [
                    {
                      "profile": {
                        "name": "John Doe"
                      },
                      "wa_id": "916269880874"
                    }
                  ],
                  "messages": [
                    {
                      "from": "916269880874",
                      "id": "wamid.HBgLOTE2MjY5ODgwODc0FQIAERgSQjRDQkQ0NTM0OEUwODc5MkQ4AA==",
                      "timestamp": "1724855700",
                      "text": {
                        "body": "Hello, I would like to pay my outstanding outstanding amount of Rs 70."
                      },
                      "type": "text"
                    }
                  ]
                },
                "field": "messages"
              }
            ]
          }
        ]
      },
      delivered: {
        "object": "whatsapp_business_account",
        "entry": [
          {
            "id": "123456789012345",
            "changes": [
              {
                "value": {
                  "messaging_product": "whatsapp",
                  "metadata": {
                    "display_phone_number": "15555555555",
                    "phone_number_id": "1209225485597206"
                  },
                  "statuses": [
                    {
                      "id": "wamid.HBgLOTE2MjY5ODgwODc0FQIAERgSQjRDQkQ0NTM0OEUwODc5MkQ4AA==",
                      "status": "delivered",
                      "timestamp": "1724855705",
                      "recipient_id": "916269880874"
                    }
                  ]
                },
                "field": "messages"
              }
            ]
          }
        ]
      },
      read: {
        "object": "whatsapp_business_account",
        "entry": [
          {
            "id": "123456789012345",
            "changes": [
              {
                "value": {
                  "messaging_product": "whatsapp",
                  "metadata": {
                    "display_phone_number": "15555555555",
                    "phone_number_id": "1209225485597206"
                  },
                  "statuses": [
                    {
                      "id": "wamid.HBgLOTE2MjY5ODgwODc0FQIAERgSQjRDQkQ0NTM0OEUwODc5MkQ4AA==",
                      "status": "read",
                      "timestamp": "1724855710",
                      "recipient_id": "916269880874"
                    }
                  ]
                },
                "field": "messages"
              }
            ]
          }
        ]
      }
    };

    // Load initial text preset
    document.getElementById('postPayload').value = JSON.stringify(PRESETS.text, null, 2);

    // Set default target URL to the current page's origin + '/api/webhook'
    const defaultUrl = window.location.origin + '/api/webhook';
    document.getElementById('webhookUrl').value = defaultUrl;

    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      const selectedTab = Array.from(document.querySelectorAll('.tab')).find(tab => 
        tabId === 'get-tab' ? tab.textContent.includes('GET') : tab.textContent.includes('POST')
      );
      if (selectedTab) selectedTab.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function loadPresetPayload() {
      const type = document.getElementById('payloadType').value;
      document.getElementById('postPayload').value = JSON.stringify(PRESETS[type], null, 2);
    }

    function log(message, type = 'info') {
      const container = document.getElementById('consoleLogs');
      const div = document.createElement('div');
      div.className = `log-line log-${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function updateBadge(statusText, type) {
      const badge = document.getElementById('responseStatus');
      badge.textContent = statusText;
      badge.className = `status-badge status-${type}`;
    }

    async function runVerificationTest() {
      const baseUrl = document.getElementById('webhookUrl').value;
      const token = document.getElementById('verifyToken').value;
      const mode = document.getElementById('hubMode').value;
      const challenge = document.getElementById('hubChallenge').value;

      const url = new URL(baseUrl);
      url.searchParams.append('hub.mode', mode);
      url.searchParams.append('hub.verify_token', token);
      url.searchParams.append('hub.challenge', challenge);

      log(`Initiating GET Verification to ${baseUrl}...`, 'info');
      log(`Parameters: hub.mode="${mode}", hub.verify_token="${token}", hub.challenge="${challenge}"`, 'log-input');
      updateBadge('Pending', 'info');

      try {
        const response = await fetch(url.toString(), { method: 'GET' });
        const responseBody = await response.text();

        log(`Response Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
        log(`Response Body: "${responseBody}"`, 'info');

        if (response.ok) {
          if (responseBody === challenge) {
            log('SUCCESS: Webhook verification successful! The server echoed back the correct challenge string.', 'success');
            updateBadge('Success', 'success');
          } else {
            log(`WARNING: Webhook returned status 200 but echoed wrong challenge. Expected "${challenge}" but got "${responseBody}".`, 'error');
            updateBadge('Mismatch', 'error');
          }
        } else {
          log(`FAILED: Server responded with status ${response.status}. Verify token or server configuration.`, 'error');
          updateBadge(`Error: ${response.status}`, 'error');
        }
      } catch (error) {
        log(`CRITICAL ERROR: Failed to fetch. Please verify that your backend server is running and CORS is enabled. Details: ${error.message}`, 'error');
        updateBadge('Network Error', 'error');
      }
    }

    async function runEventTest() {
      const baseUrl = document.getElementById('webhookUrl').value;
      const payloadString = document.getElementById('postPayload').value;

      let payloadJson;
      try {
        payloadJson = JSON.parse(payloadString);
      } catch (e) {
        log(`JSON Parsing Error: Please make sure the JSON body is correctly formatted. Details: ${e.message}`, 'error');
        return;
      }

      log(`Initiating POST Event Delivery simulator to ${baseUrl}...`, 'info');
      log(`Sending JSON Payload...`, 'log-input');
      updateBadge('Pending', 'info');

      try {
        const response = await fetch(baseUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payloadJson)
        });
        const responseBody = await response.text();

        log(`Response Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
        log(`Response Body: "${responseBody}"`, 'info');

        if (response.ok) {
          log('SUCCESS: Event payload acknowledged by the webhook server.', 'success');
          updateBadge('Acknowledge', 'success');
        } else {
          log(`FAILED: Webhook server returned error status ${response.status}.`, 'error');
          updateBadge(`Error: ${response.status}`, 'error');
        }
      } catch (error) {
        log(`CRITICAL ERROR: Failed to fetch. Verify server running status. Details: ${error.message}`, 'error');
        updateBadge('Network Error', 'error');
      }
    }
  </script>
</body>
</html>
